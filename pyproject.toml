[project]
name = "firecrawl-skill"
version = "0.1.0"
description = "Agent-facing web search and URL extraction CLI backed by the Firecrawl v2 API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in live API tests (set RUN_FIRECRAWL_INTEGRATION=1 plus FIRECRAWL_API_KEY or ONEPASSWORD_FIRECRAWL_REFERENCE)",
]
